<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo 3D - Gestão</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDK (Módulos) -->
    <script type="module" src="app.js" defer></script>
    <link rel="icon" type="image/png" href="logonx3.png">
    
    <!-- CSS adicional para a tag de licença -->
    <style>
        .tag-licenca {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .tag-comercial {
            background-color: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }
        .tag-sem-licenca {
            background-color: #ffebee;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
        }
        .tag-info {
            background-color: #f5f5f5;
            color: #424242;
            border: 1px solid #e0e0e0;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <div class="nav-icons">
                <button id="nav-produtos" class="icon-btn active" onclick="switchTab('produtos')"><i class="fas fa-box"></i></button>
                <button id="nav-novo" class="icon-btn" onclick="switchTab('novo')"><i class="fas fa-plus-square"></i></button>
                <button id="nav-config" class="icon-btn" onclick="switchTab('config')"><i class="fas fa-cog"></i></button>
            </div>
            <div class="search-bar" id="search-container" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <!-- Select de filtro por tipo -->
                <select id="search-tipo" onchange="filtrarProdutos()" style="padding: 5px; border-radius: 4px; border: none; outline: none; background: transparent; color: #fff;">
                    <option value="todos" style="color: #000;">Todos os Tipos</option>
                </select>
                
                <!-- NOVO: Select de Ordenação -->
                <select id="sort-tipo" onchange="filtrarProdutos()" style="padding: 5px; border-radius: 4px; border: none; outline: none; background: transparent; color: #fff;">
                    <option value="padrao" style="color: #000;">Ordenar por...</option>
                    <option value="lucro-maior" style="color: #000;">Maior Lucro</option>
                    <option value="preco-maior" style="color: #000;">Maior Preço</option>
                    <option value="preco-menor" style="color: #000;">Menor Preço</option>
                </select>

                <!-- Input de pesquisa textual -->
                <div style="display: flex; align-items: center; background: rgba(255,255,255,0.2); border-radius: 4px; padding: 0 10px;">
                    <i class="fas fa-search" style="color: #fff;"></i>
                    <input type="text" id="search-input" placeholder="Buscar produto ou código..." oninput="filtrarProdutos()" style="background: transparent; border: none; color: #fff; padding: 5px; outline: none; margin-left: 5px;">
                </div>
            </div>
        </header>

        <!-- PÁGINA 1: Lista de Produtos -->
        <main id="tab-produtos" class="tab-content active">
            <div class="products-grid" id="products-list">
                <!-- Os produtos serão gerados aqui via JavaScript -->
            </div>
        </main>

        <!-- PÁGINA 2: Cadastro / Edição de Produtos -->
        <main id="tab-novo" class="tab-content">
            <div class="form-container">
                <div class="form-header-actions">
                    <button id="btn-excluir" class="action-btn" style="background-color: #ff3333; display: none;" onclick="excluirProduto()"><i class="fas fa-trash"></i></button>
                    <button class="action-btn save-btn" onclick="salvarProduto()"><i class="fas fa-save"></i></button>
                    <button class="action-btn clear-btn" onclick="limparFormulario()"><i class="fas fa-eraser"></i></button>
                </div>
                
                <div class="form-row">
                    <div class="input-group grow-2">
                        <label>Foto URL:</label>
                        <input type="text" id="prod-foto" placeholder="Link da imagem">
                    </div>
                    <div class="input-group counter-group">
                        <label>Produtos Vendidos</label>
                        <div class="counter">
                            <button onclick="updateVendas(-1)"><i class="fas fa-minus-circle"></i></button>
                            <input type="number" id="prod-vendidos" value="0">
                            <button onclick="updateVendas(1)"><i class="fas fa-plus-circle"></i></button>
                        </div>
                    </div>
                </div>

                <!-- CAMPO CÓDIGO E TIPO DO PRODUTO -->
                <div class="form-row">
                    <div class="input-group">
                        <label>Código do Produto:</label>
                        <input type="text" id="prod-codigo" placeholder="Ex: NX-001">
                    </div>
                    <div class="input-group grow-2">
                        <label>Tipo de Produto:</label>
                        <select id="prod-tipo" style="margin-top: 5px;">
                            <option value="">Selecione o tipo</option>
                            <!-- Carregado via JS das Configurações -->
                        </select>
                    </div>
                </div>

                <!-- CAMPO NOME DO PRODUTO E LICENÇA LADO A LADO -->
                <div class="form-row">
                    <div class="input-group grow-2">
                        <label>Nome do Produto:</label>
                        <input type="text" id="prod-nome">
                    </div>
                    <div class="input-group">
                        <label>Possui Licença Comercial?</label>
                        <select id="prod-licenca" style="margin-top: 5px;">
                            <option value="sim">Sim (Permitido vender)</option>
                            <option value="nao">Não (Apenas pessoal)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Horas de Impressão (Ex: 1.5):</label>
                        <input type="number" step="0.01" id="prod-horas" oninput="calcularCustoProduto()">
                    </div>
                    <div class="input-group">
                        <label>Quantidade em Estoque:</label>
                        <input type="number" id="prod-qtd">
                    </div>
                </div>

                <div class="card-section">
                    <h4>Filamentos Utilizados</h4>
                    <div id="filamentos-list">
                        <!-- Linhas de filamento serão adicionadas aqui -->
                    </div>
                    <button class="add-circle-btn" onclick="adicionarLinhaFilamento()"><i class="fas fa-plus-circle"></i></button>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Outros Valores (R$):</label>
                        <input type="number" step="0.01" id="prod-outros" oninput="calcularCustoProduto()">
                    </div>
                    
                    <div class="input-group readonly" style="background-color: #f8f9fa;">
                        <label>Custo de Produção:</label>
                        <input type="text" id="prod-custo-total" readonly style="font-weight: bold; color: #555;">
                    </div>
                
                    <div class="input-group readonly">
                        <label>Valor Sugerido:</label>
                        <input type="text" id="prod-sugerido" readonly>
                    </div>
                </div>
                
                <div class="form-row" style="margin-top: 15px;">
                    <div class="input-group highlight" style="border: 2px solid #333;">
                        <label>Valor de Venda (Cobrado):</label>
                        <input type="number" step="0.01" id="prod-cobrado" oninput="calcularCustoProduto()">
                    </div>
                
                    <div class="input-group readonly" style="background-color: #e8f5e9;">
                        <label>Lucro Estimado:</label>
                        <input type="text" id="prod-lucro" readonly style="font-weight: bold; color: #2e7d32;">
                    </div>
                </div>

            </div>
        </main>

        <!-- PÁGINA 3: Configurações e Custos Base -->
        <main id="tab-config" class="tab-content">
            <div class="form-container">
                <div class="form-header-actions">
                    <button class="action-btn save-btn" onclick="salvarConfiguracoes()"><i class="fas fa-save"></i></button>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>Energia elétrica (R$/kWh):</label>
                        <input type="number" step="0.001" id="cfg-energia" value="1.500">
                    </div>
                    <div class="input-group">
                        <label>Consumo médio da impressora (kW):</label>
                        <input type="number" step="0.001" id="cfg-consumo" value="0.210">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Custo da máquina/hora (R$):</label>
                        <input type="number" step="0.001" id="cfg-maquina" value="0.315">
                    </div>
                    <div class="input-group">
                        <label>Mão de obra/hora (R$):</label>
                        <input type="number" step="0.01" id="cfg-maoobra" value="5.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Margem de lucro (Ex: 0.4 para 40%):</label>
                        <input type="number" step="0.01" id="cfg-margem" value="0.40">
                    </div>
                    <div class="input-group">
                        <label>Embalagem por peça (R$):</label>
                        <input type="number" step="0.01" id="cfg-embalagem" value="1.50">
                    </div>
                </div>

                <!-- NOVA SESSÃO: TIPOS DE PRODUTOS -->
                <div class="card-section">
                    <h4>Tipos de Produto (Categorias)</h4>
                    <div id="tipos-list">
                        <!-- Tipos configurados aqui -->
                    </div>
                    <button class="add-circle-btn" onclick="adicionarLinhaTipo()"><i class="fas fa-plus-circle"></i></button>
                </div>

                <div class="card-section">
                    <h4>Estoque de Filamentos (Matéria Prima)</h4>
                    <div id="materiais-list">
                        <!-- Materiais configurados aqui -->
                    </div>
                    <button class="add-circle-btn" onclick="adicionarLinhaMaterial()"><i class="fas fa-plus-circle"></i></button>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // Funções simples de UI que não dependem de módulo
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.icon-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');

            const searchBar = document.getElementById('search-container');
            if(tabId === 'produtos') {
                searchBar.style.visibility = 'visible';
            } else {
                searchBar.style.visibility = 'hidden';
            }
        }
        
        function updateVendas(val) {
            let input = document.getElementById('prod-vendidos');
            let current = parseInt(input.value) || 0;
            if(current + val >= 0) {
                input.value = current + val;
            }
        }
    </script>
</body>
</html>
